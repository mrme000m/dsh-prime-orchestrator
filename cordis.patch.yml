# dsh-prime-orchestrator bundle patch.
#
# Installing this package through the official CLI —
#
#   dsh plugin --profile web add dsh-prime-orchestrator
#   (or: dsh plugin --profile web add github:<owner>/dsh-prime-orchestrator)
#
# — reconciles `dsh.profile.bundles` against installed packages and, seeing
# the `dsh.bundle.patch` declaration in package.json, appends this package to
# the profile's bundle stack. The profile boot then merges this patch: one
# insert of the host row.
#
# The single row carries the whole feature:
#   - node half  (exports "."):        the Prime Orchestration engine
#                                      (ctx.prime, /prime JSON API, the
#                                      prime-orchestrator settings namespace)
#                                      plus startup materialization of the
#                                      `prime-orchestrator` agent preset into
#                                      your user preset root
#                                      ($DSH_HOME/.agent-presets).
#   - agent half  (exports
#     "./agent-tool"):                 mounted by the materialized preset's
#                                      agent.cordis.yml — the prime_agent
#                                      tool, the workflow prompt section, and
#                                      the bundled prime-agent skill.
#   - browser half (exports "./client",
#     declared via dsh.client):        the pending-questions banner
#                                      (shell.overlay seat). The Prime fleet
#                                      column and the Settings → Prime
#                                      Orchestration section live in the harness
#                                      core's @deepseek-ai/dsh-client-ui-prime
#                                      and @deepseek-ai/dsh-client-ui-prime-settings.
#
# If a profile already carries a manual mount line for this plugin (or for
# the older @deepseek-ai/dsh-prime-* workspace packages) in its own
# cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting.
- insert:
    - id: prime-orchestration
      name: 'dsh-prime-orchestrator'
    # Host-plane LLM adapter: registers a Cloudflare Workers AI
    # chat-completions adapter on the host `llm` service under the
    # `cf-workers-ai-native` provider route (OpenAI-compatible endpoint,
    # fetch + SSE, harness StreamChunk protocol) so the harness can call
    # Workers AI without the pi-ai SDK layer.
    - id: llm-cf-provider
      name: 'dsh-prime-orchestrator/llm-cf-provider'
    # Bitwarden vault tools moved to the agent preset (presets/prime-orchestrator/
    # agent.cordis.yml, row `bw-tools`): the account registry is per-preset
    # config, and the tools register into the host `tools` registry from the
    # preset's standing scope.
    # WunderTrading access tools: wt_status, wt_session, wt_login,
    # wt_browse, wt_api (HMAC REST), wt_apikey, wt_mcp — wrapping the
    # bundled bin/wt.mjs CLI (bdg + headful CloakBrowser sessions,
    # Bitwarden-persisted cookies) and registering the wt-network skill.
    - id: wt-tools
      name: 'dsh-prime-orchestrator/wt-tools'
